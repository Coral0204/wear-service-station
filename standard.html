<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>标码男装｜对接类目</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background: #f6f7f9;
    color: #1f2937;
}

a {
    color: inherit;
    text-decoration: none;
}

.header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
}

.header-inner {
    max-width: 1180px;
    height: 72px;
    margin: auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
}

.back {
    color: #6b7280;
    font-size: 14px;
}

.back:hover {
    color: #111827;
}

.container {
    max-width: 1180px;
    margin: auto;
    padding: 55px 24px 80px;
}

.page-title {
    margin-bottom: 30px;
}

.page-title h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.page-title p {
    color: #6b7280;
}

.search-box {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 20px;
}

.search {
    width: 100%;
    height: 52px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 15px;
    outline: none;
}

.search:focus {
    border-color: #111827;
}

.hot-search {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.hot-search span {
    padding: 6px 12px;
    border-radius: 20px;
    background: #f3f4f6;
    color: #6b7280;
    font-size: 12px;
    cursor: pointer;
}

.hot-search span:hover {
    background: #e5e7eb;
    color: #111827;
}

.result-info {
    display: flex;
    justify-content: space-between;
    margin: 25px 0 12px;
    color: #6b7280;
    font-size: 13px;
}

.category-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.category-item {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 17px 20px;
    line-height: 1.7;
    font-size: 14px;
    transition: .2s;
}

.category-item:hover {
    border-color: #cfd3d8;
    transform: translateX(2px);
}

.category-item .main-category {
    color: #9ca3af;
    font-size: 12px;
    margin-bottom: 3px;
}

.empty {
    background: #fff;
    border-radius: 12px;
    padding: 60px 20px;
    text-align: center;
    color: #9ca3af;
    display: none;
}

.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 13px;
    padding: 30px;
}

@media(max-width:768px) {

    .container {
        padding: 40px 16px 60px;
    }

    .page-title h1 {
        font-size: 30px;
    }

    .category-item {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <a href="index.html" class="back">
            ← 返回对接类目
        </a>
    </div>
</header>

<main class="container">

    <div class="page-title">
        <h1>标码男装</h1>
        <p>请选择或搜索需要对接的男装类目</p>
    </div>

    <div class="search-box">

        <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="搜索类目，例如：背心、衬衫、牛仔、运动、潜水……"
        >

        <div class="hot-search">
            <span onclick="quickSearch('背心')">背心</span>
            <span onclick="quickSearch('衬衫')">衬衫</span>
            <span onclick="quickSearch('牛仔')">牛仔</span>
            <span onclick="quickSearch('运动')">运动</span>
            <span onclick="quickSearch('潜水')">潜水</span>
            <span onclick="quickSearch('套装')">套装</span>
        </div>

    </div>

    <div class="result-info">
        <span>类目列表</span>
        <span id="count"></span>
    </div>

    <div id="categoryList" class="category-list"></div>

    <div id="empty" class="empty">
        没有找到相关类目
    </div>

</main>

<footer class="footer">
    服装开发参考站
</footer>


<script>

/* =========================
   标码男装类目数据
   ========================= */

const categories = [

"运动与户外用品>运动户外服饰>男士运动户外服饰>内衣>男士运动装汗衫",

"运动与户外用品>运动户外服饰>男士运动户外服饰>潜水服>男士潜水服",

"运动与户外用品>运动户外服饰>男士运动户外服饰>背心>男士运动背心",

"运动与户外用品>运动户外服饰>男士运动户外服饰>骑行服>男士骑行背心",

"运动与户外用品>运动户外服饰>男士运动户外服饰>球衣>男士球衣",

"运动与户外用品>运动户外服饰>男士运动户外服饰>运动长裤>男士运动长裤",

"运动与户外用品>运动户外服饰>男士运动户外服饰>运动短裤>男士运动短裤",

"运动与户外用品>运动户外服饰>男士运动户外服饰>运动上衣>男士运动上衣",

"运动与户外用品>运动户外服饰>男士运动户外服饰>紧身衣>男士紧身衣",

"运动与户外用品>运动户外服饰>男士运动户外服饰>运动套装>男士运动上装和下装套装",

"运动与户外用品>运动户外服饰>男士运动户外服饰>雨衣>男士雨衣",

"服装、鞋靴和珠宝饰品>男士时尚>男士上衣>男士衬衫",

"服装、鞋靴和珠宝饰品>男士时尚>男士上衣>男士T恤",

"服装、鞋靴和珠宝饰品>男士时尚>男士上衣>背心上衣",

"服装、鞋靴和珠宝饰品>男士时尚>男士上衣>男士牛仔衬衣",

"服装、鞋靴和珠宝饰品>男士时尚>男士下装>男装牛仔裤",

"服装、鞋靴和珠宝饰品>男士时尚>男士下装>男士牛仔短裤",

"服装、鞋靴和珠宝饰品>男士时尚>男士下装>男士休闲裤",

"服装、鞋靴和珠宝饰品>男士时尚>男士下装>男士短裤",

"服装、鞋靴和珠宝饰品>男士时尚>男士套装>男士运动上装和下装套装",

"服装、鞋靴和珠宝饰品>男士时尚>男士外套>男士夹克",

"服装、鞋靴和珠宝饰品>男士时尚>男士外套>男士风衣",

"服装、鞋靴和珠宝饰品>男士时尚>男士外套>男士棉服",

"服装、鞋靴和珠宝饰品>男士时尚>男士外套>男士羽绒服",

"服装、鞋靴和珠宝饰品>男士时尚>男士工作服>男士工作服",

"服装、鞋靴和珠宝饰品>男士时尚>男士制服>男士医护服",

"服装、鞋靴和珠宝饰品>男士时尚>男士制服>男士厨师服",

"服装、鞋靴和珠宝饰品>男士时尚>男士制服>男士军服",

"运动与户外用品>运动户外服饰>男士运动户外服饰>足球服>男士足球服",

"运动与户外用品>运动户外服饰>男士运动户外服饰>瑜伽服>男士瑜伽服",

"运动与户外用品>运动户外服饰>男士运动户外服饰>拳击服>男士拳击服",

"运动与户外用品>运动户外服饰>男士运动户外服饰>篮球服>男士篮球服",

"运动与户外用品>运动户外服饰>男士运动户外服饰>滑雪服>男士滑雪服",

"运动与户外用品>运动户外服饰>男士运动户外服饰>棒球服>男士棒球服",

"运动与户外用品>运动户外服饰>男士运动户外服饰>高尔夫服>男士高尔夫服",

];


/* =========================
   页面渲染
   ========================= */

const input = document.getElementById("searchInput");
const list = document.getElementById("categoryList");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

function render(keyword = "") {

    keyword = keyword.trim().toLowerCase();

    const result = categories.filter(item =>
        item.toLowerCase().includes(keyword)
    );

    list.innerHTML = "";

    count.textContent = `共 ${result.length} 个类目`;

    if (result.length === 0) {
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    result.forEach(item => {

        const parts = item.split(">");

        const div = document.createElement("div");

        div.className = "category-item";

        div.innerHTML = `
            <div class="main-category">
                ${parts.slice(0, -1).join(" > ")}
            </div>
            <div>
                ${parts[parts.length - 1]}
            </div>
        `;

        list.appendChild(div);

    });
}

function quickSearch(keyword) {

    input.value = keyword;

    render(keyword);

}

input.addEventListener("input", function() {

    render(this.value);

});

render();

</script>

</body>
</html>
