<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>版型参考｜男装开发参考站</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    background:#f5f6f8;

    color:#222;
}


/* =========================
   顶部
========================= */

.header{

    height:68px;

    background:#fff;

    border-bottom:1px solid #eaeaea;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 6%;

    position:sticky;

    top:0;

    z-index:100;

}

.logo{

    font-size:19px;

    font-weight:700;

}

.logo span{

    margin-left:8px;

    color:#999;

    font-size:12px;

    font-weight:400;

}

.nav{

    display:flex;

    gap:28px;

}

.nav a{

    color:#666;

    text-decoration:none;

    font-size:14px;

}

.nav a.active{

    color:#111;

    font-weight:600;

}


/* =========================
   容器
========================= */

.container{

    width:88%;

    max-width:1200px;

    margin:0 auto;

}


/* =========================
   标题
========================= */

.hero{

    padding:65px 0 35px;

}

.back{

    display:inline-block;

    margin-bottom:22px;

    color:#777;

    text-decoration:none;

    font-size:13px;

}

.back:hover{

    color:#111;

}

.tag{

    display:inline-block;

    padding:6px 12px;

    background:#111;

    color:#fff;

    font-size:11px;

    border-radius:4px;

    margin-bottom:18px;

}

.hero h1{

    font-size:40px;

    margin-bottom:12px;

}

.hero p{

    color:#777;

    font-size:14px;

    line-height:1.8;

}


/* =========================
   当前商品类型
========================= */

.current-type{

    background:#fff;

    padding:20px 23px;

    border-radius:9px;

    margin-bottom:28px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.current-type-left{

    display:flex;

    align-items:center;

    gap:12px;

}

.current-label{

    color:#999;

    font-size:12px;

}

.current-name{

    font-size:18px;

    font-weight:600;

}


/* =========================
   类型切换
========================= */

.type-nav{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-bottom:28px;

}

.type-btn{

    padding:9px 16px;

    border:1px solid #ddd;

    background:#fff;

    border-radius:5px;

    cursor:pointer;

    font-size:13px;

    color:#555;

}

.type-btn:hover{

    border-color:#111;

    color:#111;

}

.type-btn.active{

    background:#111;

    color:#fff;

    border-color:#111;

}


/* =========================
   图片区域
========================= */

.section-title{

    font-size:22px;

    margin-bottom:17px;

}

.style-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;

    margin-bottom:70px;

}


/* =========================
   图片卡片
========================= */

.style-card{

    background:#fff;

    border-radius:10px;

    overflow:hidden;

    border:1px solid #eee;

}

.style-image{

    width:100%;

    aspect-ratio:3/4;

    background:#eee;

    overflow:hidden;

}

.style-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}

.style-info{

    padding:18px;

}

.style-name{

    font-size:16px;

    font-weight:600;

    margin-bottom:7px;

}

.style-desc{

    color:#999;

    font-size:12px;

    line-height:1.7;

}


/* =========================
   无图片
========================= */

.empty{

    grid-column:1/-1;

    background:#fff;

    border-radius:10px;

    padding:80px 20px;

    text-align:center;

}

.empty h3{

    margin-bottom:10px;

    font-size:18px;

}

.empty p{

    color:#999;

    font-size:13px;

    line-height:1.8;

}


/* =========================
   提示
========================= */

.tip{

    background:#fff;

    padding:22px;

    border-radius:9px;

    margin-bottom:70px;

    color:#777;

    font-size:13px;

    line-height:1.8;

}

.tip strong{

    color:#222;

}


/* =========================
   Footer
========================= */

footer{

    background:#111;

    color:#888;

    text-align:center;

    padding:28px;

    font-size:12px;

}


/* =========================
   手机
========================= */

@media(max-width:900px){

    .nav{

        display:none;

    }

    .style-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

}

@media(max-width:600px){

    .container{

        width:92%;

    }

    .hero h1{

        font-size:30px;

    }

    .style-grid{

        grid-template-columns:1fr;

    }

    .current-type{

        flex-direction:column;

        align-items:flex-start;

        gap:10px;

    }

}

</style>

</head>


<body>


<header class="header">


    <div class="logo">

        男装开发参考站

        <span>
            Product Development
        </span>

    </div>


    <nav class="nav">

        <a href="index.html">
            类目对接
        </a>

        <a
            href="style.html"
            class="active">
            版型参考
        </a>

        <a href="#">
            面料方向
        </a>

        <a href="#">
            颜色趋势
        </a>

        <a href="#">
            图案趋势
        </a>

        <a href="#">
            开发建议
        </a>

    </nav>


</header>



<main class="container">


<section class="hero">


    <a
        href="index.html"
        class="back">
        ← 返回类目对接
    </a>


    <div>

        <span class="tag">
            STYLE REFERENCE
        </span>

    </div>


    <h1 id="pageTitle">
        版型参考
    </h1>


    <p>
        根据您选择的商品类型，
        提供对应版型参考。
        <br>
        以下内容仅作为商品开发方向参考。
    </p>


</section>



<section class="current-type">


    <div class="current-type-left">

        <span class="current-label">
            当前选择
        </span>

        <span
            id="currentType"
            class="current-name">
            衬衫
        </span>

    </div>


</section>



<div
    id="typeNav"
    class="type-nav">

</div>



<h2 class="section-title">

    版型参考

</h2>



<section
    id="styleGrid"
    class="style-grid">

</section>



<div class="tip">

    <strong>
        说明：
    </strong>

    版型图片仅作为开发方向参考，
    实际开发时可结合目标市场、
    面料特性、季节及商品定位进行调整。

</div>


</main>



<footer>

    男装开发参考站 · Product Development Reference

</footer>



<script>


/* =====================================================

===================================================== */

const params =
    new URLSearchParams(

    );


let currentType =

/* =====================================================

===================================================== */

        },

        },

            desc:"肩线自然下落，整体呈现更加松弛的穿着效果。"
        },

        {
            name:"工装感衬衫",
            image:"images/shirt/shirt-06.jpg",
            desc:"结合口袋、结构线等元素，强化功能及工装属性。"
        }

    ],



    "背心":[

        {
            name:"基础背心",
            image:"images/vest/vest-01.jpg",
            desc:"简洁基础的背心廓形，适合日常及基础款开发。"
        },

        {
            name:"宽松背心",
            image:"images/vest/vest-02.jpg",
            desc:"加宽衣身，突出宽松舒适感。"
        },

        {
            name:"运动背心",
            image:"images/vest/vest-03.jpg",
            desc:"强调运动属性及活动空间。"
        },

        {
            name:"宽肩背心",
            image:"images/vest/vest-04.jpg",
            desc:"增加肩部覆盖面积，视觉更加挺括。"
        }

    ],



    "套装":[

        {

        },

        {
            name:"宽松套装",
            image:"images/set/set-03.jpg",
            desc:"上下装均采用宽松比例，强化舒适感。"
        },

        {
            name:"短款套装",
            image:"images/set/set-04.jpg",
            desc:"通过缩短上装比例打造年轻化视觉。"
        }

    ],



    "牛仔":[

        {
            name:"经典牛仔衬衫",
            image:"images/denim/denim-01.jpg",
            desc:"经典牛仔衬衫结构，适合基础牛仔系列。"
        },

        {
            name:"宽松牛仔衬衫",
            image:"images/denim/denim-02.jpg",
            desc:"宽松廓形，更符合休闲及年轻化方向。"
        },

        {
            name:"牛仔夹克",

            desc:"短款结构，强化牛仔外套属性。"
        },

        {

            image:"images/denim/denim-04.jpg",
            desc:"宽松裤型，适合休闲及街头方向。"
        }

    ],



    "孕妇装":[

        {
            name:"基础孕妇T恤",
            image:"images/maternity/maternity-01.jpg",
            desc:"基础舒适型孕妇T恤版型。"
        },

        {
            name:"宽松孕妇T恤",
            image:"images/maternity/maternity-02.jpg",
            desc:"增加腹部空间，突出舒适穿着体验。"
        },

        {

        },

        {

            desc:"通过褶皱结构增加腹部活动空间。"
        }

    ],



    "短裤":[

        {
            name:"休闲短裤",
            image:"images/shorts/shorts-01.jpg",
            desc:"基础休闲短裤版型。"
        },

        {
            name:"运动短裤",
            image:"images/shorts/shorts-02.jpg",
            desc:"强调活动空间及运动属性。"
        },

        {
            name:"宽松短裤",
            image:"images/shorts/shorts-03.jpg",
            desc:"宽松裤腿，提升舒适感。"
        }

    ],



    "长裤":[

        {
            name:"直筒长裤",
            image:"images/pants/pants-01.jpg",
            desc:"经典直筒裤型，适合基础男装。"
        },

        {
            name:"宽松长裤",
            image:"images/pants/pants-02.jpg",
            desc:"增加裤腿空间，强调舒适和休闲感。"
        },

        {
            name:"束脚运动裤",
            image:"images/pants/pants-03.jpg",
            desc:"适合运动及休闲场景。"
        }

    ],



    "上衣":[

        {
            name:"常规上衣",
            image:"images/top/top-01.jpg",
            desc:"基础常规廓形。"
        },

        {
            name:"宽松上衣",
            image:"images/top/top-02.jpg",
            desc:"宽松舒适的整体版型。"
        },

        {
            name:"Oversize上衣",
            image:"images/top/top-03.jpg",
            desc:"年轻化、潮流化版型方向。"
        }

    ]

};


/* =====================================================
   类型导航
===================================================== */

const typeList = [

    "衬衫",
    "背心",
    "套装",
    "牛仔",
    "孕妇装",
    "短裤",
    "长裤",
    "上衣"

];


function renderTypeNav(){

    const nav =
        document.getElementById(
            "typeNav"
        );

    nav.innerHTML = "";


    typeList.forEach(type=>{

        const button =
            document.createElement("button");

        button.className =
            "type-btn";


        if(type === currentType){

            button.classList.add(
                "active"
            );

        }


        button.innerText =
            type;


        button.onclick =
            function(){

                currentType = type;

                window.history.pushState(
                    {},
                    "",
                    "style.html?type=" +
                    encodeURIComponent(type)
                );

                renderPage();

            };


        nav.appendChild(button);

    });

}


/* =====================================================
   页面渲染
===================================================== */

function renderPage(){

    document
        .getElementById(
            "currentType"
        )
        .innerText =
            currentType;


    document
        .getElementById(
            "pageTitle"
        )
        .innerText =
            currentType +
            " · 版型参考";


    renderTypeNav();


    const grid =
        document.getElementById(
            "styleGrid"
        );


    grid.innerHTML = "";


    const data =
        styleData[currentType] || [];


    if(data.length === 0){

        grid.innerHTML = `

            <div class="empty">

                <h3>
                    暂无该商品的版型参考
                </h3>

                <p>
                    后续可继续补充该商品类型的版型图片。
                </p>

            </div>

        `;

        return;

    }


    data.forEach(item=>{

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "style-card";


        card.innerHTML = `

            <div class="style-image">

                <img
                    src="${item.image}"
                    alt="${item.name}"
                    onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=&quot;height:100%;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;&quot;>图片待添加</div>'"
                >

            </div>


            <div class="style-info">

                <div class="style-name">
                    ${item.name}
                </div>

                <div class="style-desc">
                    ${item.desc}
                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}


/* =====================================================
   初始化
===================================================== */

renderPage();


</script>


</body>

</html>
