      <section class="topic-hero"><p class="eyebrow">COLOR DIRECTION</p><h1>用配色建立，<em>商品辨识度。</em></h1><p>先用稳定的基础色建立系列，再以高辨识度配色或局部撞色突出重点款。</p></section>
      <section class="topic-grid"><article><span>01</span><h2>稳定基底色</h2><p>黑、灰、藏青、卡其等低饱和颜色，适合支撑男装与套装的系列化开发。</p></article><article><span>02</span><h2>高辨识度点色</h2><p>用一处橙、宝蓝或亮黄完成视觉聚焦，控制面积以保持日常穿着感。</p></article><article><span>03</span><h2>撞色细节</h2><p>在领口、侧缝、袖口或裤侧加入撞色，让基础版型更容易被记住。</p></article></section>
