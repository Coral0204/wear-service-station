<!doctype html>
<html lang="zh-CN">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>版型参考 · 男装商家运营服务站</title>

<link rel="stylesheet" href="style.css">

<style>

.category-page{
  max-width:1180px;
  margin:50px auto;
  padding:0 20px;
}

.back{
  display:inline-block;
  margin-bottom:30px;
  color:#777;
  text-decoration:none;
  font-size:13px;
}

.back:hover{
  color:#f26a21;
}

.category-hero{
  background:#111;
  color:#fff;
  border-radius:28px;
  padding:50px;
  margin-bottom:30px;
}

.category-hero span{
  color:#f26a21;
  font-size:11px;
  letter-spacing:2px;
}

.category-hero h1{
  font-size:40px;
  margin:15px 0 10px;
}

.category-hero p{
  color:#aaa;
  margin:0;
}

/* 图片网格 */

.reference-grid{
  columns:3 280px;
  column-gap:18px;
}

.reference-card{
  break-inside:avoid;
  margin-bottom:18px;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #eee;
  cursor:pointer;
  transition:.25s;
}

.reference-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.reference-card img{
  width:100%;
  display:block;
  transition:.3s;
}

.reference-card:hover img{
  transform:scale(1.02);
}

.reference-info{
  padding:15px 18px;
}

.reference-info h3{
  margin:0 0 5px;
  font-size:15px;
}

.reference-info p{
  margin:0;
  color:#999;
  font-size:12px;
}

/* 手机 */

@media(max-width:800px){

  .category-page{
    margin:30px auto;
  }

  .category-hero{
    padding:32px;
  }

  .category-hero h1{
    font-size:30px;
  }

  .reference-grid{
    columns:2 160px;
  }

}

@media(max-width:500px){

  .reference-grid{
    columns:1;
  }

}

</style>

</head>
