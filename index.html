<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>服装开发参考站｜对接类目</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background: #f6f7f9;
    color: #1f2937;
}

a {
    text-decoration: none;
    color: inherit;
}

.header {
    background: #ffffff;
    border-bottom: 1px solid #eaecef;
}

.header-inner {
    max-width: 1180px;
    margin: auto;
    height: 72px;
    display: flex;
    align-items: center;
    padding: 0 24px;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
}

.logo span {
    color: #666;
    font-size: 12px;
    margin-left: 8px;
    font-weight: 400;
}

.hero {
    max-width: 1180px;
    margin: auto;
    padding: 80px 24px 50px;
}

.hero h1 {
    font-size: 42px;
    line-height: 1.25;
    margin-bottom: 16px;
}

.hero p {
    font-size: 16px;
    color: #6b7280;
}

.section {
    max-width: 1180px;
    margin: auto;
    padding: 0 24px 80px;
}

.section-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 24px;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.category-card {
    position: relative;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 38px 32px;
    min-height: 220px;
    transition: all .25s ease;
    overflow: hidden;
}

.category-card:hover {
    transform: translateY(-5px);
    border-color: #111827;
    box-shadow: 0 12px 35px rgba(0,0,0,.08);
}

.card-number {
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 28px;
}

.category-card h2 {
    font-size: 28px;
    margin-bottom: 12px;
}

.category-card p {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.7;
}

.card-arrow {
    position: absolute;
    right: 28px;
    bottom: 25px;
    font-size: 24px;
    transition: transform .2s;
}

.category-card:hover .card-arrow {
    transform: translateX(5px);
}

.footer {
    border-top: 1px solid #e5e7eb;
    text-align: center;
    color: #9ca3af;
    font-size: 13px;
    padding: 28px 20px;
}

@media (max-width: 768px) {

    .hero {
        padding: 55px 20px 35px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .section {
        padding: 0 20px 60px;
    }

    .category-grid {
        grid-template-columns: 1fr;
    }

    .category-card {
        min-height: 180px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">
            服装开发参考站
            <span>Product Development Reference</span>
        </div>
    </div>
</header>

<main>

    <section class="hero">
        <h1>对接类目</h1>
        <p>选择需要查看的服装类目，进入对应类目页面。</p>
    </section>

    <section class="section">

        <div class="section-title">
            对接类目
        </div>

        <div class="category-grid">

            <a href="standard.html" class="category-card">
                <div class="card-number">01 / CATEGORY</div>

                <h2>标码男装</h2>

                <p>
                    查看标码男装可对接类目，
                    支持类目关键词搜索。
                </p>

                <div class="card-arrow">→</div>
            </a>

            <a href="plus.html" class="category-card">
                <div class="card-number">02 / CATEGORY</div>

                <h2>大码男装</h2>

                <p>
                    查看大码男装可对接类目，
                    支持类目关键词搜索。
                </p>

                <div class="card-arrow">→</div>
            </a>

            <a href="maternity.html" class="category-card">
                <div class="card-number">03 / CATEGORY</div>

                <h2>孕妇装</h2>

                <p>
                    查看孕妇装可对接类目，
                    支持类目关键词搜索。
                </p>

                <div class="card-arrow">→</div>
            </a>

        </div>

    </section>

</main>

<footer class="footer">
    服装开发参考站
</footer>

</body>
</html>
