<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>大码男装｜对接类目</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background: #f6f7f9;
    color: #1f2937;
}

a {
    text-decoration: none;
    color: inherit;
}

.header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
}

.header-inner {
    max-width: 1180px;
    height: 72px;
    margin: auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
}

.back {
    color: #6b7280;
    font-size: 14px;
}

.container {
    max-width: 1180px;
    margin: auto;
    padding: 55px 24px 80px;
}

.page-title h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.page-title p {
    color: #6b7280;
    margin-bottom: 30px;
}

.search-box {
    background: #fff;
    padding: 18px;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
}

.search {
    width: 100%;
    height: 52px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 15px;
    outline: none;
}

.search:focus {
    border-color: #111827;
}

.hot-search {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.hot-search span {
    background: #f3f4f6;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    color: #6b7280;
    cursor: pointer;
}

.result-info {
    display: flex;
    justify-content: space-between;
    margin: 25px 0 12px;
    color: #6b7280;
    font-size: 13px;
}

.category-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.category-item {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 17px 20px;
    font-size: 14px;
    line-height: 1.7;
}

.main-category {
    color: #9ca3af;
    font-size: 12px;
    margin-bottom: 3px;
}

.empty {
    display: none;
    background: #fff;
    border-radius: 12px;
    padding: 60px 20px;
    text-align: center;
    color: #9ca3af;
}

.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 13px;
    padding: 30px;
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <a href="index.html" class="back">
            ← 返回对接类目
        </a>
    </div>
</header>

<main class="container">

    <div class="page-title">
        <h1>大码男装</h1>
        <p>请选择或搜索需要对接的男装类目</p>
    </div>

    <div class="search-box">

        <input
            id="searchInput"
            class="search"
            placeholder="搜索类目，例如：背心、衬衫、牛仔、运动……"
        >

        <div class="hot-search">
            <span onclick="quickSearch('背心')">背心</span>
            <span onclick="quickSearch('衬衫')">衬衫</span>
            <span onclick="quickSearch('牛仔')">牛仔</span>
            <span onclick="quickSearch('运动')">运动</span>
            <span onclick="quickSearch('套装')">套装</span>
        </div>

    </div>

    <div class="result-info">
        <span>类目列表</span>
        <span id="count"></span>
    </div>

    <div id="categoryList" class="category-list"></div>

    <div id="empty" class="empty">
        没有找到相关类目
    </div>

</main>

<footer class="footer">
    服装开发参考站
</footer>

<script>

const categories = [

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码男士休闲运动服>大码男士休闲运动套装>大码男士径赛服",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码背心上衣",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码男装单马甲",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码男士沙滩裤",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码男士装扮服饰",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码男士长袍",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码男士上衣",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码男士裤子",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码针织背心",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码运动上装和下装套装",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码运动服系扣衬衫",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码男士雨衣",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码男士泳裤",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码西服",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码西裤",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码西装马甲",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码牛仔裤",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码牛仔短裤",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码亨利衫",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码运动装汗衫",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码休闲运动背心",

"服装、鞋靴和珠宝饰品>男士时尚>大码男装>大码正装衬衫"

];

const input = document.getElementById("searchInput");
const list = document.getElementById("categoryList");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

function render(keyword = "") {

    keyword = keyword.trim().toLowerCase();

    const result = categories.filter(item =>
        item.toLowerCase().includes(keyword)
    );

    list.innerHTML = "";

    count.textContent = `共 ${result.length} 个类目`;

    empty.style.display =
        result.length === 0 ? "block" : "none";

    result.forEach(item => {

        const parts = item.split(">");

        const div = document.createElement("div");

        div.className = "category-item";

        div.innerHTML = `
            <div class="main-category">
                ${parts.slice(0, -1).join(" > ")}
            </div>
            <div>
                ${parts[parts.length - 1]}
            </div>
        `;

        list.appendChild(div);

    });
}

function quickSearch(keyword) {

    input.value = keyword;

    render(keyword);

}

input.addEventListener("input", function() {
    render(this.value);
});

render();

</script>

</body>
</html>
